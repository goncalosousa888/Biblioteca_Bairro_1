<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contactos · Biblioteca do Bairro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="cabecalho">
    <a class="logo" href="index.html">Biblioteca do Bairro</a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="eventos.html">Eventos</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contactos.html">Contactos</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contactos</h1>
    <p>Escreva-nos ou inscreva-se num evento.</p>
    <form action="#" method="post">
      <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
      </div>
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5"></textarea>
      </div>
      <div>
        <button class="botao" type="submit">Enviar</button>
      </div>
    </form>
  </main>

  <footer class="rodape">
    <div>
      <h3>Morada</h3>
      <p>Rua das Flores, 12<br>4000-000 Porto</p>
    </div>
    <div>
      <h3>Horário</h3>
      <p>Ter–sex 10h–19h<br>Sáb 10h–13h</p>
    </div>
    <div>
      <h3>Contactos</h3>
      <p><a href="mailto:ola@biblioteca.example">ola@biblioteca.example</a><br>220 000 000</p>
    </div>
  </footer>
</body>
</html>
