<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · Biblioteca do Bairro</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Biblioteca do Bairro</h1>
    <button id="tema" type="button">Modo escuro</button>
  </header>

  <main>
    <section>
      <h2 id="resumo"></h2>

      <div class="controlos">
        <label for="pesquisa">Pesquisar</label>
        <input id="pesquisa" type="search" placeholder="Título do livro">
        <button id="so-disponiveis" type="button" aria-pressed="false">Só disponíveis</button>
      </div>

      <ul id="lista-livros"></ul>
    </section>

    <section>
      <h2>Clube de leitura</h2>
      <form id="inscricao" novalidate>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email">
        <button type="submit">Inscrever-me</button>
        <p id="mensagem" role="status"></p>
      </form>
    </section>
  </main>
</body>
</html>
