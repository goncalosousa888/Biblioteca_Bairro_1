<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · Biblioteca do Bairro</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Biblioteca do Bairro</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="catalogo.html" aria-current="page">Catálogo</a>
    </nav>
    <button id="tema" type="button" aria-pressed="false">Modo escuro</button>
  </header>

  <main>
    <h2 id="resumo">A carregar…</h2>

    <div class="ferramentas">
      <label for="pesquisa">Pesquisar</label>
      <input id="pesquisa" type="search" placeholder="Título ou autor">
      <button id="so-disponiveis" type="button" aria-pressed="false">Só disponíveis</button>
    </div>

    <p id="erro-catalogo" class="erro" role="alert"></p>
    <ul id="lista-livros"></ul>

    <section class="clube">
      <h2>Clube de leitura</h2>
      <form id="inscricao" novalidate>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <button type="submit">Inscrever-me</button>
        <p id="mensagem" role="status"></p>
      </form>
    </section>
  </main>
</body>
</html>
